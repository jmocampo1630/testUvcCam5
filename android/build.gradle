buildscript {
    ext {
        buildToolsVersion = "34.0.0"  // Changed from 36.0.0 to stable version
        minSdkVersion = 24
        compileSdkVersion = 34        // Changed from 36 to stable version
        targetSdkVersion = 34         // Changed from 36 to stable version
        ndkVersion = "27.3.13750724"
        kotlinVersion = "1.9.10"      // Changed from 2.1.20 to stable version
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
